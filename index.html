function toggle(set,i){ set.has(i)?set.delete(i):set.add(i); state.limit=30; render(); }

  const f = isFiltered() && !opts.noBench;
  return '<div class="bars">'+labels.map((l,i)=>{
    const p = pc(cur[i],n), pa = pc(all[i],nAll), d = p-pa;
    let delta = '';
    if(f){ delta = Math.abs(d)<0.05 ? '<span class="delta eq">与整体持平</span>' : `<span class="delta ${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${pp(d)}</span>`; }
    const tip = `<b>${esc(l)}</b><br>${fmt(cur[i])} 人 / ${fmt(n)} 人 = ${P(p)}`+(f?`<br>整体：${P(pa)}（${pp(d)}）`:'');
    const dim = opts.dimSet && opts.dimSet.size && !opts.dimSet.has(i) ? ' style="opacity:.4"' : '';
    return `<div class="bar"${dim} data-tip="${esc(tip)}"><div class="l">${esc(l)}</div><div class="track"><div class="fill" style="width:${p.toFixed(2)}%"></div>${f?`<div class="bench" style="left:calc(${pa.toFixed(2)}% - 1px)"></div>`:''}</div><div class="v">${P(p)}<span class="n">${fmt(cur[i])}人</span>${delta}</div></div>`;
  }).join('')+'</div>'+(f?'<div class="legend"><span><i class="lg-fill"></i>当前筛选</span><span><i class="lg-bench"></i>整体水平</span><span><span class="up">▲</span>/<span class="dn">▼</span> 高于/低于整体</span></div>':'');
}
function conclBox(paras){ return `<div class="concl"><span class="lbl">结论</span><div>${paras.filter(Boolean).map(p=>'<p>'+p+'</p>').join('')}</div></div>`; }
function head(title, qtext, kind){ return `<div class="phead"><div><h2>${esc(title)}<span class="tag">${kind}</span></h2><p class="q">${esc(qtext)}</p></div></div>`; }

function diffSentence(labels, cur, n, all, nAll, thr=3){
  if(!isFiltered()) return '';
  const ds = labels.map((l,i)=>({l, d:pc(cur[i],n)-pc(all[i],nAll)})).filter(x=>x.l!==OTHER && Math.abs(x.d)>=thr).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,3);
  if(!ds.length) return `与整体相比分布基本一致，各项差异都在 ${thr}pp 以内。`;
  return '与整体相比：'+ds.map(x=>`${q(x.l)}<b class="${x.d>0?'up':'dn'}">${x.d>0?'高':'低'} ${Math.abs(x.d).toFixed(1)}pp</b>`).join('，')+'。';
}
function ranked(labels, cur, n){
  return labels.map((l,i)=>({l,i,c:cur[i],p:pc(cur[i],n)})).filter(x=>x.l!==OTHER).sort((a,b)=>b.c-a.c);
}

function renderMulti(key, el, rows, n){
  const dm = DIMS[key], k = dm.labels.length;
  const cur = countMask(rows,dm.col,k), all = countMask(ALL,dm.col,k);
  const r = ranked(dm.labels,cur,n);
  const avg = n ? rows.reduce((s,x)=>s+bits(x[dm.col]),0)/n : 0;
  const paras = [];
  paras.push(`${q(r[0].l)}居首，<b>${P(r[0].p)}</b> 的人选择；其次是${q(r[1].l)}（${P(r[1].p)}）`+(r[0].p-r[1].p>=15?`，第一名领先 ${(r[0].p-r[1].p).toFixed(1)}pp，是明显的共识。`:'，两项接近，同为重点。')+`人均勾选 ${avg.toFixed(1)} 项。`);
  if(key==='ob'){
    const iTalk = dm.labels.indexOf('自身话术不足'), iShop = dm.labels.indexOf('店内不重视金融');

  }
  if(key==='ab'){
    const iRate = D.OB.indexOf('利率相对竞品偏高'), iProd = 0;
    const a = rows.filter(x=>x[2]>>iRate&1), b = rows.filter(x=>!(x[2]>>iRate&1));
    const pa = pc(a.filter(x=>x[3]>>iProd&1).length,a.length), pb = pc(b.filter(x=>x[3]>>iProd&1).length,b.length);
    if(a.length>=15 && b.length>=15) paras.push(`认为${q('利率相对竞品偏高')}的人里，${P(pa)} 急需${q(dm.labels[iProd])}，未选利率问题的人为 ${P(pb)}${Math.abs(pa-pb)>=3?`（${pp(pa-pb)}）`:''}。${pa>pb?'利率压力越大，越需要“讲清产品优势”的弹药。':''}`);
  }
  if(key==='fm'){
    const onlineOnly = rows.filter(x=>x[4]===1).length, anyOff = rows.filter(x=>x[4] & 0b11110).length;
    const offRank = ranked(dm.labels.slice(1,5), cur.slice(1,5), n);
    paras.push(`只选线上直播的占 <b>${P(pc(onlineOnly,n))}</b>；愿意参加至少一种线下形式的占 <b>${P(pc(anyOff,n))}</b>，线下形式中最受欢迎的是${q(offRank[0].l)}（${P(offRank[0].p)}）。建议以线上直播为主，线下以${q(offRank[0].l)}作为补充。`);
  }
  paras.push(diffSentence(dm.labels,cur,n,all,ALL.length));
  el.innerHTML = head(dm.title, dm.q, '多选') + conclBox(paras) + barsHTML(dm.labels,cur,n,all,ALL.length);
}

/* ---------- heatmap ---------- */
function renderHeat(){
  const dm = DIMS[state.heat], k = dm.labels.length;
  const byCh = state.by==='ch';
  const base = byCh ? filterRows(false,true) : filterRows(true,false);
  const groups = byCh ? CH_SHORT : D.TN;
  const gcol = byCh ? 0 : 1, sel = byCh ? state.ch : state.tn;
  const gRows = groups.map((_,g)=>base.filter(r=>r[gcol]===g));
  const gN = gRows.map(x=>x.length);
  const M = gRows.map(rs=>countMask(rs,dm.col,k).map((c,i)=>pc(c,rs.length)));
  const tot = countMask(base,dm.col,k).map(c=>pc(c,base.length));
  const dimOf = g => sel.size && !sel.has(g) ? ' dim' : '';
  let h = '<thead><tr><th class="rl">选项</th>'+groups.map((g,j)=>`<th class="${sel.has(j)?'sel':''}${dimOf(j)}">${esc(g)}<small>n=${gN[j]}</small></th>`).join('')+`<th>合计<small>n=${base.length}</small></th></tr></thead><tbody>`;
  dm.labels.forEach((l,i)=>{
    h += `<tr><th class="rl">${esc(l)}</th>`;
    groups.forEach((g,j)=>{
      const v = M[j][i], mix = Math.round(6 + v*0.9), dark = mix>=60;
      const tip = `<b>${esc(g)} · ${esc(l)}</b><br>${P(v)}（本组 ${gN[j]} 人）<br>合计：${P(tot[i])}，${pp(v-tot[i])}`;
      h += `<td class="${dimOf(j).trim()}" data-tip="${esc(tip)}" style="background:color-mix(in oklab, var(--accent) ${mix}%, var(--surface));color:${dark?'var(--on-accent)':'var(--ink)'}">${gN[j]?v.toFixed(1):'–'}</td>`;
    });
    h += `<td class="tot">${tot[i].toFixed(1)}</td></tr>`;
  });
  $('heat').innerHTML = h+'</tbody>';

  // conclusions
  const ok = groups.map((_,j)=>gN[j]>=20);
  const items = dm.labels.map((l,i)=>{
    const vals = groups.map((g,j)=>({g,v:M[j][i]})).filter((_,j)=>ok[j]);
    if(vals.length<2) return null;
    vals.sort((a,b)=>b.v-a.v);
    return {l, hi:vals[0], lo:vals[vals.length-1], spread:vals[0].v-vals[vals.length-1].v};
  }).filter(x=>x && x.l!==OTHER).sort((a,b)=>b.spread-a.spread);
  const paras = [];
  const gname = byCh ? '渠道' : '年限组';
  if(!items.length){ paras.push('当前筛选下可比较的分组不足（每组至少 20 人），暂不做组间结论。'); }
  else if(items[0].spread<5){ paras.push(`各${gname}的选择高度一致，最大差异仅 ${items[0].spread.toFixed(1)}pp（${q(items[0].l)}）。`); }
  else {
    const t = items.filter(x=>x.spread>=5).slice(0,2);
    paras.push(t.map((x,j)=>`${j?'其次是':''}${q(x.l)}${j?'':`在${gname}间差异最大`}：<b>${esc(x.hi.g)} ${P(x.hi.v)}</b> vs ${esc(x.lo.g)} ${P(x.lo.v)}（相差 ${x.spread.toFixed(1)}pp）`).join('；')+'。');
    const feats = groups.map((g,j)=>{
      if(!ok[j]) return null;
      let best=null; dm.labels.forEach((l,i)=>{ if(l===OTHER) return; const d=M[j][i]-tot[i]; if(!best||d>best.d) best={l,d}; });
      return best && best.d>=3 ? `${esc(g)}更突出${q(best.l)}（${pp(best.d)}）` : null;
    }).filter(Boolean);
    if(feats.length) paras.push('相对合计水平，'+feats.join('；')+'。');
  }
  if(sel.size) paras.push(`表头高亮的是当前筛选的${byCh?'渠道':'年限'}，其余列淡化显示以便对照。`);
  $('heatConcl').innerHTML = '<span class="lbl">结论</span><div>'+paras.map(p=>'<p>'+p+'</p>').join('')+'</div>';
}

/* ---------- open text ---------- */
function themeBars(names, texts){
  const k = names.length, cnt = new Array(k+1).fill(0);
  texts.forEach(t=>{ if(!t.m) cnt[k]++; for(let i=0;i<k;i++) if(t.m>>i&1) cnt[i]++; });
  return cnt;
}
function quoteMeta(t){ const r=ALL[t.r]; return `<span>${esc(D.CH[r[0]])}</span><span>${esc(D.TN[r[1]])}</span>`; }
function renderSug(rows){
  const idx = new Set(rows.map(r=>r[6]));
  const texts = TEXTS.filter(t=>t.k==='s' && idx.has(t.r));
  const names = D.SUG.concat(['其他']), K = D.SUG.length;
  const cnt = themeBars(D.SUG, texts), n = texts.length;
  const order = names.map((l,i)=>({l,i,c:cnt[i]})).sort((a,b)=> (a.i===K)-(b.i===K) || b.c-a.c);
  const top = order.filter(x=>x.i!==K).slice(0,3);
  const online = cnt[0], offline = cnt[2] + cnt[1];
  const paras = n ? [
    `${fmt(n)} 人留下了具体建议（占 ${P(pc(n,rows.length))}，其余填“无”）。提及最多的是${top.map(x=>`${q(x.l)}${x.c}条`).join('、')}。`,
    `关于“办不办线下”意见分化：${cnt[0]} 条倾向线上或不便离岗，${cnt[1]} 条要求就近、到店或按区域，${cnt[2]} 条支持线下面授交流。若组织线下，就近与不占用工作时间是前提。`
  ] : ['当前筛选下没有具体建议。'];
  let h = head('线下培训建议（开放题）','如果要组织线下培训，您对培训有什么建议？','开放题') + conclBox(paras);
  h += '<div class="themes">'+order.map(x=>{
    const p = pc(x.c,n);
    return `<button type="button" class="bar chip-row" data-th="${x.i}" style="all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;border-radius:4px;${state.theme===x.i?'outline:2px solid var(--accent);outline-offset:3px':''}" aria-pressed="${state.theme===x.i}" data-tip="${esc(`<b>${esc(x.l)}</b><br>${x.c} 条，占有效建议 ${P(p)}<br>点击筛选原话`)}"><span class="l" style="font-size:13px">${esc(x.l)}</span><span class="track"><span class="fill" style="width:${(n?x.c/Math.max(...cnt)*100:0).toFixed(1)}%"></span></span><span class="v num" style="text-align:right;font-size:12.5px">${x.c}<span class="n" style="color:var(--ink-3);font-size:11px"> 条</span></span></button>`;
  }).join('')+'</div>';
  let list = texts.filter(t=> state.theme<0 || (state.theme===K ? !t.m : (t.m>>state.theme&1)));
  if(state.q) list = list.filter(t=>t.x.includes(state.q));
  h += `<div class="qtools"><input id="sugQ" type="search" placeholder="搜索建议原话" value="${esc(state.q)}" aria-label="搜索建议原话">${state.theme>=0?`<button type="button" class="reset" id="clrTheme">取消主题：${esc(names[state.theme])}</button>`:''}<span class="fstate" style="margin-left:0">${list.length} 条</span></div>`;
  h += list.length ? '<ul class="quotes">'+list.slice(0,state.limit).map(t=>`<li><span class="t">${esc(t.x)}</span><span class="m">${quoteMeta(t)}${names.filter((_,i)=>i<K && t.m>>i&1).map(s=>`<span class="th">#${esc(s)}</span>`).join('')}</span></li>`).join('')+'</ul>' : '<p class="empty">没有符合条件的建议。</p>';
  if(list.length>state.limit) h += `<button type="button" class="more" id="more">再显示 ${Math.min(30,list.length-state.limit)} 条（共 ${list.length} 条）</button>`;
  const el = $('pSug'); el.innerHTML = h;
  el.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.th; state.theme = state.theme===i?-1:i; state.limit=30; renderSug(filterRows()); });
  const inp=$('sugQ'); inp.oninput=()=>{ state.q=inp.value.trim(); state.limit=30; const pos=inp.selectionStart; renderSug(filterRows()); const ni=$('sugQ'); ni.focus(); try{ni.setSelectionRange(pos,pos);}catch(e){} };
  if($('clrTheme')) $('clrTheme').onclick=()=>{ state.theme=-1; renderSug(filterRows()); };
  if($('more')) $('more').onclick=()=>{ state.limit+=30; renderSug(filterRows()); };
}

/* ---------- core + KPIs ---------- */
function renderCore(rows, n){
  const nAll = ALL.length;
  const kp = rs => {
    const N = rs.length;
    return { n:N, dealers:new Set(rs.map(r=>r[5])).size, senior:pc(rs.filter(r=>r[1]===3).length,N), online:pc(rs.filter(r=>r[4]&1).length,N), obAvg:N?rs.reduce((s,r)=>s+bits(r[2]),0)/N:0 };
  };
  const c = kp(rows), a = kp(ALL), f = isFiltered();
  const dl = (v,b,unit='pp',dec=1) => f ? (()=>{ const d=v-b; return Math.abs(d)<0.05?'<span class="eq">与整体持平</span>':`<span class="${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${unit==='pp'?pp(d):(d>0?'+':'−')+Math.abs(d).toFixed(dec)+unit}</span> 较整体`; })() : '';
  $('kpis').innerHTML = [
    ['样本数', fmt(c.n)+'<small style="font-size:13px;color:var(--ink-3)"> 份</small>', f?`占全部 ${P(pc(c.n,nAll))}`:'全部问卷'],
    ['覆盖门店', fmt(c.dealers)+'<small style="font-size:13px;color:var(--ink-3)"> 家</small>', '按店代码去重'],
    ['从业 5 年以上', P(c.senior), f?dl(c.senior,a.senior):'资深人员占比'],
    ['偏好线上直播', P(c.online), f?dl(c.online,a.online):'培训形式勾选线上直播'],
    ['人均勾选阻碍', c.obAvg.toFixed(2)+'<small style="font-size:13px;color:var(--ink-3)"> 项</small>', f?dl(c.obAvg,a.obAvg,' 项',2):'阻碍原因多选题'],
  ].map(([k,v,s])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

  $('coreScope').textContent = `范围：${scopeName()}，${fmt(n)} 份问卷。结论随筛选自动更新。`;
  if(!n){ $('coreList').innerHTML='<li>当前筛选组合下没有问卷，请放宽筛选条件。</li>'; $('coreWarn').innerHTML=''; return; }
  const L = [];
  const ob = countMask(rows,2,D.OB.length), ab = countMask(rows,3,D.AB.length), fm = countMask(rows,4,D.FM.length);
  const ro = ranked(D.OB,ob,n), ra = ranked(D.AB,ab,n);
  L.push(`<b>最大阻碍是${q(ro[0].l)}</b>（${P(ro[0].p)}），其次${q(ro[1].l)}（${P(ro[1].p)}）；选择${q('自身话术不足')}的只有 ${P(pc(ob[D.OB.indexOf('自身话术不足')],n))}，一线普遍把问题归因于外部。`);
  L.push(`<b>最想补的能力是${q(ra[0].l)}</b>（${P(ra[0].p)}），其次${q(ra[1].l)}（${P(ra[1].p)}）。`+(ra[0].l.includes('产品优势')&&ra[1].l.includes('客户心理')?`课程主线建议围绕“讲清产品优势 + 读懂客户”，对应${q(ro[0].l)}和${q(ro[1].l)}两大阻碍。`:`课程主线建议优先覆盖这两项。`));
  const onlineOnly = pc(rows.filter(r=>r[4]===1).length,n), anyOff = pc(rows.filter(r=>r[4]&0b11110).length,n);
  const offR = ranked(D.FM.slice(1,5), fm.slice(1,5), n);
  L.push(`<b>培训形式以线上直播为主</b>：${P(pc(fm[0],n))} 选择线上直播，${P(onlineOnly)} 只接受线上；${P(anyOff)} 愿意参加线下，首选${q(offR[0].l)}（${P(offR[0].p)}）。`);
  const tn = countCat(rows,1,4);
  const newbie = rows.filter(r=>r[1]===0), vet = rows.filter(r=>r[1]===3);
  if(newbie.length>=15 && vet.length>=15){
    const iPol = D.AB.indexOf('金融政策了解及系统操作'), iStore = D.FM.indexOf('入店手把手带教');
    const p1 = pc(newbie.filter(r=>r[3]>>iPol&1).length,newbie.length), p2 = pc(vet.filter(r=>r[3]>>iPol&1).length,vet.length);
    const s1 = pc(newbie.filter(r=>r[4]>>iStore&1).length,newbie.length), s2 = pc(vet.filter(r=>r[4]>>iStore&1).length,vet.length);
    L.push(`<b>新人与资深需求不同</b>：1 年以内的新人有 ${P(p1)} 急需${q('金融政策了解及系统操作')}（5 年以上为 ${P(p2)}），想要${q('入店手把手带教')}的比例为 ${P(s1)}（5 年以上 ${P(s2)}）。${p1-p2>=3?'建议为新人单独设置政策与系统操作的入门课。':''}`);
  } else {
    L.push(`当前样本以${q(D.TN[tn.indexOf(Math.max(...tn))])}为主（${P(pc(Math.max(...tn),n))}），新人或资深组人数不足 15 人，暂不做年限对比。`);
  }
  const idx = new Set(rows.map(r=>r[6]));
  const sg = TEXTS.filter(t=>t.k==='s' && idx.has(t.r));
  if(sg.length){
    const cnt = themeBars(D.SUG, sg); const top = D.SUG.map((l,i)=>({l,c:cnt[i]})).sort((a,b)=>b.c-a.c).slice(0,2);
    L.push(`<b>开放建议</b>：${fmt(sg.length)} 条具体建议中，最集中的是${q(top[0].l)}（${top[0].c} 条）和${q(top[1].l)}（${top[1].c} 条）。`);
  }
  if(f){
    // biggest deviation across all multi dims + tenure
    const cand = [];
    [['阻碍原因',D.OB,2],['急需能力',D.AB,3],['培训形式',D.FM,4]].forEach(([k,labels,col])=>{
      const cu=countMask(rows,col,labels.length), al=countMask(ALL,col,labels.length);
      labels.forEach((l,i)=>{ if(l!==OTHER) cand.push({l, dim:k, d:pc(cu[i],n)-pc(al[i],nAll)}); });
    });
    cand.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    const t = cand.filter(x=>Math.abs(x.d)>=3).slice(0,3);
    L.push(t.length ? `<b>与整体相比最突出的差异</b>：`+t.map(x=>`${esc(x.dim)}·${q(x.l)}<b class="${x.d>0?'up':'dn'}">${x.d>0?'高':'低'} ${Math.abs(x.d).toFixed(1)}pp</b>`).join('；')+'。' : `<b>与整体相比</b>：该群体在阻碍、能力和形式三题上与整体基本一致（差异均小于 3pp），可沿用统一的培训方案。`);
  }
  $('coreList').innerHTML = L.map(x=>'<li><span>'+x+'</span></li>').join('');
  $('coreWarn').innerHTML = n<50 ? `<div class="warn">当前样本仅 ${n} 份，比例波动较大，结论仅供参考。</div>` : '';
}

/* ---------- tooltip ---------- */
const tip = $('tip');
function showTip(el, x, y){
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let L = x+14, T = y+14;
  if(L+w > innerWidth-8) L = x-w-14;
  if(T+h > innerHeight-8) T = y-h-14;
  tip.style.left = Math.max(8,L)+'px'; tip.style.top = Math.max(8,T)+'px';
}
document.addEventListener('pointermove', e=>{ const el=e.target.closest('[data-tip]'); if(el) showTip(el,e.clientX,e.clientY); else tip.hidden=true; });
document.addEventListener('pointerleave', ()=>tip.hidden=true);
addEventListener('scroll', ()=>tip.hidden=true, {passive:true});

/* ---------- render ---------- */
function render(){
  save(); syncChips();
  const rows = filterRows(), n = rows.length;
  $('fstate').innerHTML = `当前：${esc(scopeName())} · <b class="num" style="color:var(--ink)">${fmt(n)}</b> 份`;
  renderCore(rows,n);
  renderChannel(rows,n); renderTenure(rows,n);
  if(n){ renderMulti('ob',$('pOb'),rows,n); renderMulti('ab',$('pAb'),rows,n); renderMulti('fm',$('pFm'),rows,n); }
  else ['pOb','pAb','pFm'].forEach(id=>$(id).innerHTML='<p class="empty">当前筛选组合下没有问卷。</p>');
  renderHeat(); renderSug(rows); renderOther(rows);
}
$('mTotal').textContent = fmt(ALL.length);
$('mDealers').textContent = fmt(new Set(ALL.map(r=>r[5])).size);
buildChips(); render();
})();
</script>
